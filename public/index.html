<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Exchange</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>ФАЙЛОСОС</h1>
    <form id="uploadForm">
      <input
        type="file"
        id="fileInput"
        accept=".jpg,.jpeg,.png,.pdf,.zip,.mp4,.mp3,.docx,.xlsx"
        class="form-control mb-3"
        required
      />
      <p id="fileSizeError" class="error-message" style="display: none">File size exceeds the limit of 1GB.</p>
      <button type="submit" class="btn btn-primary w-100">Покормить сайт</button>
    </form>
    <div id="downloadLinkContainer" style="display: none">
      <p class="text-success">Your file has been uploaded successfully!</p>
      <a id="downloadLink" href="#" target="_blank" class="btn btn-outline-primary w-100">Download Link</a>
    </div>
    <div id="uploadStatus" class="mt-3 text-center"></div>
    <hr />
    <h2>Загруженные файлы</h2>
    <ul id="fileList" class="list-unstyled"></ul>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
